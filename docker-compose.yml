version: '3.8'

services:
  incident-app:
    build: .
    container_name: it-incident-app
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/incident.db
      - ADMIN_PASSCODE=${ADMIN_PASSCODE:-admin1234}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-incidenthub-aes256-enterprise-secret-key-2026}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-https://outlook.office.com/webhook/your-webhook-url}
